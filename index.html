<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #stage{position:fixed;inset:0;cursor:pointer}
  .tree{position:absolute;will-change:transform}
  .tree canvas,#slab{position:absolute;left:0;top:0}
  .tree.sway{animation:sway var(--d,7s) ease-in-out infinite}
  @keyframes sway{0%{transform:rotate(0)}25%{transform:rotate(var(--a,.5deg))}75%{transform:rotate(calc(var(--a,.5deg) * -1))}100%{transform:rotate(0)}}
  /* flutter: wrapper holds the leaf's fixed angle, the canvas inside animates with plain literal keyframes (compositor-friendly) */
  .lw{position:absolute;transform-origin:50% 100%}
  .lw canvas{position:absolute;left:0;top:0;transform-origin:50% 100%;animation:f1 2.4s ease-in-out infinite}
  .lw.a2 canvas{animation-name:f2}.lw.a3 canvas{animation-name:f3}
  @keyframes f1{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
  @keyframes f2{0%,100%{transform:rotate(0)}25%{transform:rotate(-5.5deg)}75%{transform:rotate(5.5deg)}}
  @keyframes f3{0%,100%{transform:rotate(0)}25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
  @media (prefers-reduced-motion: reduce){.tree.sway,.lw canvas{animation:none!important}}
  .gust{position:absolute;will-change:transform}
  .plant{position:absolute;transform-origin:50% 100%;pointer-events:none}
  .plant canvas{position:absolute;left:0;top:0;transform-origin:50% 100%}
  .plant.sw canvas{animation:psway var(--d,3s) ease-in-out infinite}
  @keyframes psway{0%,100%{transform:rotate(0)}25%{transform:rotate(var(--a,2deg))}75%{transform:rotate(calc(var(--a,2deg) * -1))}}
  @media (prefers-reduced-motion: reduce){.plant.sw canvas{animation:none!important}}
  .gust > .tree{left:0;top:0}
  .lw{transition:opacity 2.5s}
  #wet{position:absolute;left:0;pointer-events:none;opacity:0;transition:opacity 5s linear;
       background:linear-gradient(to bottom,rgba(55,68,86,.36),rgba(55,68,86,.18) 16%,rgba(55,68,86,.24));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 3px 4px -2px rgba(255,255,255,.45)}
  #rain{position:absolute;left:0;top:0;pointer-events:none}
  .fall{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transition:opacity 3s}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:12px/1 system-ui,sans-serif;
        letter-spacing:.12em;color:rgba(60,58,55,.45);text-transform:lowercase;opacity:0;transition:opacity 1.5s;pointer-events:none}
  #hint.on{opacity:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">click a tree or bush to set it on fire &nbsp;·&nbsp; click empty space to regrow &nbsp;·&nbsp; f fire all &nbsp;·&nbsp; w gust &nbsp;·&nbsp; r rain &nbsp;·&nbsp; z reset</div>
<script>
(() => {
'use strict';
const P = (dir, names) => names.map(n => 'assets/' + dir + '/' + n);
const STICKS = P('sticks', ['stick_dl_1.png','stick_dl_2.png','stick_dl_3.png','stick_dl_4.png','stick_dl_5.png','stick_dl_6.png','stick_gen_1.png','stick_gen_2.png']);
const LEAVES = P('leaves', ['leaf_dl_1.png','leaf_dl_2.png','leaf_dl_3.png','leaf_dl_4.png','leaf_dl_5.png','leaf_dl_6.png','leaf_dl_7.png','leaf_dl_8.png',
  'leaf_dl_9.png','leaf_dl_10.png','leaf_dl_11.png','leaf_dl_12.png','leaf_gen_1.png','leaf_gen_2.png','leaf_gen_3.png']);
const ROOTS = P('roots', ['root_dl_1.png','root_dl_2.png','root_dl_3.png','root_gen_1.png','root_gen_2.png','root_gen_3.png']);
const CLODS = P('dirt', ['clod_dl_1.png','clod_dl_2.png','clod_dl_3.png','clod_dl_4.png','clod_gen_1.png','clod_gen_2.png','clod_gen_3.png','clod_gen_4.png']);
const DIRT = P('dirt', ['dirt_dl_ground048.jpg','dirt_gen.png']);
const PLANTS = P('plants', ['grass_dl_1.png','grass_dl_2.png','grass_gen_1.png','grass_gen_2.png','grass_gen_3.png','grass_gen_4.png',
                            'bush_dl_1.png','bush_dl_2.png','bush_dl_3.png','bush_gen_1.png','bush_gen_2.png']);
const BURNT = list => list.map(p => p.replace('assets/', 'assets/burnt/'));      // charred variant of every stick / leaf / root

const stage = document.getElementById('stage'), hint = document.getElementById('hint');
const params = new URLSearchParams(location.search);
const FREEZE = params.has('t') ? parseFloat(params.get('t')) : null;   // ?t=3 renders a still at 3s (screenshots)
let seed = params.has('seed') ? parseInt(params.get('seed'), 10) : (Math.random() * 1e9) | 0;
const MAX_LEAVES = 480, MAX_FLUTTER = 180;          // leaves that keep fluttering after growth (CSS-animated, compositor only)
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let FLUTTER = !RM.matches;
RM.addEventListener && RM.addEventListener('change', () => { FLUTTER = !RM.matches; });

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd; const R = (a, b) => a + (b - a) * rnd(); const pick = a => a[(rnd() * a.length) | 0];
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c = 1.6; x -= 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

let IMG = {};             // loaded images
let leafTints = [];       // [leafIdx][tint] -> tinted full-res canvas (baked once at load)
let W, H, DPR, groundY, slabH, SLAB_TOP_PAD = 46;
let hintTimer = 0, trees = [], slab = null, rafId = 0, t0 = 0, endTime = 0, slabEnd = 0, running = false;

// ---------- one-time asset prep ----------
function bakeLeafTints(img){
  // cheap, portable tints: draw leaf, then wash a colour over it with source-atop (no ctx.filter, no pixel reads)
  return [null, 'rgba(170,160,30,.16)', 'rgba(10,55,25,.20)', 'rgba(255,250,200,.13)'].map(col => {
    const c = mkCanvas(img.width, img.height), x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    if (col) { x.globalCompositeOperation = 'source-atop'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); }
    return c;
  });
}

// ---------- geometry (unit space; y up is negative) ----------
function buildTree(maxDepth){
  const branches = [], leaves = [];
  function grow(len, w, ang, depth, start, x, y){
    const dur = 1.9 * Math.pow(0.72, depth) + R(-.15, .15);
    const img = depth < 2 ? pick(IMG.thick) : pick(IMG.thin);
    branches.push({ x, y, ang, len, w, img, flip: rnd() < .5, start, dur, depth });
    const at = f => [x + Math.sin(ang) * len * f, y - Math.cos(ang) * len * f];
    if (depth < maxDepth) {
      const n = depth === 0 ? 2 + (rnd() < .5 ? 1 : 0) : 2 + (rnd() < .3 ? 1 : 0), spread = R(.45, .75);
      const [ex, ey] = at(.97);
      for (let i = 0; i < n; i++) {
        const a = -spread + 2 * spread * (i / (n - 1)) + R(-.15, .15);
        grow(len * R(.62, .8), w * R(.62, .74), ang + a, depth + 1, start + dur * .97, ex, ey);
      }
      if (depth >= 1 && rnd() < .6) {
        const f = R(.35, .7), [sx, sy] = at(f);
        grow(len * R(.4, .55), w * .5, ang + (rnd() < .5 ? -1 : 1) * R(.7, 1.1), depth + 1, start + dur * f, sx, sy);
      }
    }
    if (depth >= maxDepth - 1) {
      const n = depth === maxDepth ? 3 + (rnd() * 2 | 0) : 1 + (rnd() * 2 | 0);
      for (let i = 0; i < n; i++) {
        const tip = depth === maxDepth && i === 0, f = tip ? 1 : depth === maxDepth ? R(.3, 1) : R(.4, .95);
        const [lx, ly] = at(f), side = tip ? 0 : (rnd() < .5 ? -1 : 1);
        leaves.push({ x: lx, y: ly, ang: ang + side * R(.5, 1.1), size: R(.75, 1.15), li: (rnd() * LEAVES.length) | 0, ti: (rnd() * 4) | 0,
          start: start + dur * f + R(.15, .8), dur: .7, tip });
      }
    }
  }
  const t0 = R(0, .3);
  grow(R(150, 200), R(26, 34), R(-.12, .12), 0, t0, 0, 0);
  return { branches, leaves, start: t0 };
}

function bboxOf(tr){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = 6;
  for (const b of tr.branches) {
    const ex = b.x + Math.sin(b.ang) * b.len, ey = b.y - Math.cos(b.ang) * b.len;
    x0 = Math.min(x0, b.x - b.w, ex - b.w); x1 = Math.max(x1, b.x + b.w, ex + b.w); y0 = Math.min(y0, ey - b.w);
  }
  for (const l of tr.leaves) { const r = 55 * l.size * 1.12; x0 = Math.min(x0, l.x - r); x1 = Math.max(x1, l.x + r); y0 = Math.min(y0, l.y - r); }
  return { x0, x1, y0, y1 };
}

// ---------- pre-rendering at final pixel size ----------
function preStick(img, wPx, lenPx, flip, flipV){
  // bake the stick image into a canvas at exactly the size it will be drawn (base at canvas bottom)
  const pad = wPx * .16, c = mkCanvas(wPx + 2, lenPx + pad + 2), x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.scale(flip ? -1 : 1, flipV ? -1 : 1);
  x.drawImage(img, -wPx / 2, -c.height / 2 + 1, wPx, c.height - 2);
  return c;
}
const leafCache = new Map();
function preLeaf(li, ti, hPx){
  const hb = Math.max(6, Math.round(hPx / 4) * 4);           // size buckets keep the cache small
  const key = li + '_' + ti + '_' + hb;
  let c = leafCache.get(key);
  if (!c) {
    const src = leafTints[li][ti], w = hb * src.width / src.height;
    c = mkCanvas(w, hb); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    leafCache.set(key, c);
  }
  return c;
}

// draw helpers (device-pixel space, no resampling except the rotation itself)
function drawStick(ctx, s, px, py, g, ox, oy){
  const c = s.pre, sh = Math.max(1, c.height * g), cs = Math.cos(s.ang), sn = Math.sin(s.ang);
  ctx.setTransform(cs, sn, -sn, cs, (s.x * s.k + ox) , (s.y * s.k + oy));
  ctx.drawImage(c, 0, c.height - sh, c.width, sh, -c.width / 2, s.w * s.k * .08 - sh, c.width, sh);
}
function drawLeaf(ctx, l, sc, ox, oy){
  const c = l.pre, cs = Math.cos(l.ang) * sc, sn = Math.sin(l.ang) * sc;
  ctx.setTransform(cs, sn, -sn, cs, l.x * l.k + ox, l.y * l.k + oy);
  ctx.drawImage(c, -c.width / 2, -c.height);
}

// ---------- layout ----------
function build(){
  rnd = mulberry(seed);
  stage.innerHTML = ''; leafCache.clear();
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  slabH = Math.round(Math.max(70, Math.min(140, H * .14)));
  groundY = H - slabH;
  const count = W < 700 ? 1 : W < 1200 ? 2 : 3, colW = W / count;
  trees = [];
  let raw = [];
  for (let i = 0; i < count; i++) raw.push(buildTree(4));
  // cap total leaves (keep tip leaves first)
  const total = raw.reduce((s, t) => s + t.leaves.length, 0);
  if (total > MAX_LEAVES) for (const t of raw) {
    const keep = Math.floor(t.leaves.length * MAX_LEAVES / total);
    t.leaves.sort((a, b) => (b.tip - a.tip) || (rnd() - .5)); t.leaves.length = keep;
  }
  raw.forEach((tr, i) => {
    tr.start += i * .45;
    tr.branches.forEach(b => b.start += i * .45); tr.leaves.forEach(l => l.start += i * .45);
    const bb = bboxOf(tr), bw = bb.x1 - bb.x0, bh = -bb.y0;
    const k = Math.min(colW * .9 / bw, (groundY - 24) / bh, 1.7);        // fit the tree inside its own column
    const cx = colW * (i + .5) - (bb.x0 + bb.x1) / 2 * k;                    // centre the canopy in the column
    const kp = k * DPR;
    // wrapper + layers, sized to the tree's bounding box
    const left = cx + bb.x0 * k - 4, top = groundY + bb.y0 * k - 4, wCss = bw * k + 8, hCss = (bb.y1 - bb.y0) * k + 8;
    const el = document.createElement('div'); el.className = 'tree';
    const origin = (cx - left) + 'px ' + (groundY - top) + 'px';
    Object.assign(el.style, { width: wCss + 'px', height: hCss + 'px', transformOrigin: origin });
    // outer wrapper takes wind gust bending (JS spring), inner .tree keeps the idle CSS sway
    const gel = document.createElement('div'); gel.className = 'gust';
    Object.assign(gel.style, { left: left + 'px', top: top + 'px', width: wCss + 'px', height: hCss + 'px', transformOrigin: origin });
    gel.appendChild(el);
    el.style.setProperty('--d', R(6, 9).toFixed(2) + 's'); el.style.setProperty('--a', R(.35, .6).toFixed(2) + 'deg');
    // pick the fluttering subset: twig-tip leaves first, then the outermost others
    const nf = Math.floor(MAX_FLUTTER / count);
    tr.leaves.map(l => ({ l, sc: (l.tip ? 1e6 : 0) + Math.hypot(l.x, l.y) + rnd() * 40 })).sort((a, b) => b.sc - a.sc)
      .forEach((e, j) => { const l = e.l; l.flutter = j < nf; l.famp = R(.06, .13); l.fw = R(1.8, 3.4); l.fph = R(0, 6.28); });
    const layers = ['bdone', 'active', 'ldone', 'flutter'].map(() => {
      const c = mkCanvas(wCss * DPR, hCss * DPR); c.style.width = wCss + 'px'; c.style.height = hCss + 'px'; el.appendChild(c); return c.getContext('2d');
    });
    stage.appendChild(gel);
    const ox = (cx - left) * DPR, oy = (groundY - top) * DPR;
    for (const b of tr.branches) { b.k = kp; b.pre = preStick(b.img, b.w * kp, b.len * kp, b.flip, false); }
    for (const l of tr.leaves) { l.k = kp; l.pre = preLeaf(l.li, l.ti, 55 * l.size * kp); }
    const items = tr.branches.map(b => ({ kind: 0, o: b })).concat(tr.leaves.map(l => ({ kind: 1, o: l })));
    const end = Math.max(...items.map(it => it.o.start + it.o.dur));
    const fl = tr.leaves.filter(l => l.flutter);
    let fb = [1e9, 1e9, -1e9, -1e9];
    for (const l of fl) { const lx = l.x * kp + ox, ly = l.y * kp + oy, r = l.pre.height * 1.05 + 2;
      fb = [Math.min(fb[0], lx - r), Math.min(fb[1], ly - r), Math.max(fb[2], lx + r), Math.max(fb[3], ly + r)]; }
    fb = [Math.max(0, Math.floor(fb[0])), Math.max(0, Math.floor(fb[1])), Math.ceil(fb[2]), Math.ceil(fb[3])];
    trees.push({ el, layers, ox, oy, pending: items, end, k, x: cx, w0: tr.branches[0].w * k, start: tr.start, dirty: null, swaying: false,
                 commit: [], fl, fbox: fb, fStart: 0, gel, bend: 0, bendV: 0, flex: R(.8, 1.2),
                 branches: tr.branches, leaves: tr.leaves, left, top, wCss, hCss, kp, fire: null });
  });
  endTime = Math.max(...trees.map(t => t.end));
  buildSlab();
  buildPlants();
}

// ---------- concrete slab, dirt openings, roots ----------
function buildSlab(){
  const c = mkCanvas(W * DPR, (slabH + SLAB_TOP_PAD) * DPR);
  c.id = 'slab'; c.style.width = W + 'px'; c.style.height = (slabH + SLAB_TOP_PAD) + 'px'; c.style.top = (groundY - SLAB_TOP_PAD) + 'px';
  stage.appendChild(c);
  const gy = SLAB_TOP_PAD * DPR;                       // ground line inside slab canvas (device px)
  // static concrete, baked once
  const base = mkCanvas(c.width, c.height), b = base.getContext('2d');
  b.scale(DPR, DPR);
  const pat = b.createPattern(IMG.concrete, 'repeat');
  b.fillStyle = pat; b.fillRect(0, SLAB_TOP_PAD, W, slabH);
  const gr = b.createLinearGradient(0, SLAB_TOP_PAD, 0, SLAB_TOP_PAD + slabH);
  gr.addColorStop(0, 'rgba(255,255,255,.35)'); gr.addColorStop(.06, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.12)');
  b.fillStyle = gr; b.fillRect(0, SLAB_TOP_PAD, W, slabH);
  b.fillStyle = 'rgba(0,0,0,.10)'; b.fillRect(0, SLAB_TOP_PAD, W, 1);
  b.strokeStyle = 'rgba(0,0,0,.07)'; b.lineWidth = 1.5;
  for (let x = W / 5; x < W; x += W / 5) { b.beginPath(); b.moveTo(x + .5, SLAB_TOP_PAD + 2); b.lineTo(x + .5, SLAB_TOP_PAD + slabH); b.stroke(); }

  const spots = trees.map((tr, ti) => {
    const s = Math.max(.5, tr.k), x = tr.x * DPR, tw = tr.w0;
    // jagged broken opening in the slab, filled with soil (pre-rendered sprite in slab coords)
    const hw = tw * R(2.1, 2.7), depth = Math.min(slabH * R(.5, .72), tw * 3.4);
    const poly = [[-hw * 1.15, 0]];
    const n = 13;
    for (let i = 1; i < n; i++) { const f = i / n, xx = -hw + 2 * hw * f; poly.push([xx + R(-3, 3) * s, depth * Math.sin(Math.PI * f) ** .45 * R(.82, 1.08) + 2]); }
    poly.push([hw * 1.15, 0]);
    // each opening gets its own small canvas (only this region animates; the big slab stays static)
    const ext = Math.max(hw * 2.9, 270 * s), left = Math.max(0, Math.floor(tr.x - ext)), right = Math.min(W, Math.ceil(tr.x + ext));
    const spotW = (right - left) * DPR, spotH = c.height;
    const hole = mkCanvas(spotW, spotH), h = hole.getContext('2d');
    h.setTransform(DPR, 0, 0, DPR, -left * DPR, 0); h.translate(tr.x, SLAB_TOP_PAD);
    const path = new Path2D(); poly.forEach(([px, py], i) => i ? path.lineTo(px, py) : path.moveTo(px, py)); path.closePath();
    h.save(); h.clip(path);
    h.fillStyle = h.createPattern(ti % 2 ? IMG.dirt[1] : IMG.dirt[0], 'repeat'); h.fillRect(-hw * 1.3, -2, hw * 2.6, depth + 8);
    const sg = h.createLinearGradient(0, 0, 0, depth); sg.addColorStop(0, 'rgba(0,0,0,.05)'); sg.addColorStop(1, 'rgba(0,0,0,.35)');
    h.fillStyle = sg; h.fillRect(-hw * 1.3, -2, hw * 2.6, depth + 8);
    h.restore();
    h.lineJoin = 'round';
    h.strokeStyle = 'rgba(35,30,26,.55)'; h.lineWidth = 2.2; h.stroke(path);               // dark broken edge
    h.translate(0, 1.2); h.strokeStyle = 'rgba(255,255,255,.35)'; h.lineWidth = 1; h.stroke(path); // light chipped rim
    // cracks radiating outward from the opening
    const cracks = [];
    for (let k = 0; k < 4 + (rnd() * 3 | 0); k++) {
      const dir = k % 2 ? 1 : -1, pts = [[tr.x + dir * hw * R(.7, 1.05), SLAB_TOP_PAD + R(2, depth * .6)]];
      let px = pts[0][0], py = pts[0][1], ang = R(.05, .7);
      for (let j = 0; j < 4 + (rnd() * 4 | 0); j++) { ang += R(-.35, .35); px += dir * Math.cos(ang) * R(8, 22) * s; py += Math.sin(Math.abs(ang)) * R(2, 7) * s; if (py > SLAB_TOP_PAD + slabH - 3) break; pts.push([px, py]); }
      cracks.push({ pts, w: R(.8, 1.8) });
    }
    // soil mound + crumbs on top of the slab, concrete chips (one sprite)
    const top = mkCanvas(spotW, spotH), tp = top.getContext('2d');
    tp.setTransform(DPR, 0, 0, DPR, -left * DPR, 0);
    tp.fillStyle = tp.createPattern(IMG.dirt[0], 'repeat');
    tp.beginPath(); tp.moveTo(tr.x - hw * 1.35, SLAB_TOP_PAD + 1);
    for (let i = 0; i <= 12; i++) { const f = i / 12, xx = tr.x - hw * 1.35 + hw * 2.7 * f; tp.lineTo(xx, SLAB_TOP_PAD + 1 - Math.sin(Math.PI * f) ** .9 * R(7, 11) * s); }
    tp.closePath(); tp.fill();
    tp.fillStyle = 'rgba(0,0,0,.18)'; tp.fill();
    const clods = [];
    for (let k = 0; k < 9 + (rnd() * 6 | 0); k++) {
      const img = pick(IMG.clods), sc = R(.35, .8) * s, onTop = rnd() < .65;
      const dx = (rnd() < .5 ? -1 : 1) * R(hw * .6, hw * (onTop ? 2.6 : 1.8));
      const cy = onTop ? SLAB_TOP_PAD + 1 - img.height * sc * R(.55, .8) : SLAB_TOP_PAD + R(4, depth + 10);
      tp.drawImage(img, tr.x + dx - img.width * sc / 2, cy, img.width * sc, img.height * sc);
    }
    tp.fillStyle = 'rgba(160,158,154,1)';
    for (let k = 0; k < 3; k++) { const dx = (k % 2 ? 1 : -1) * R(hw * 1.2, hw * 2.2), sz = R(2.5, 5) * s; tp.beginPath(); tp.moveTo(tr.x + dx, SLAB_TOP_PAD + 1); tp.lineTo(tr.x + dx + sz, SLAB_TOP_PAD + 1); tp.lineTo(tr.x + dx + sz * .4, SLAB_TOP_PAD + 1 - sz * .8); tp.fill(); }
    // roots: recursive, growing down/outward from the trunk base, drawn with root sprites
    const roots = [];
    function root(len, w, ang, depth, start, x, y){
      const dur = depth === 0 ? R(1.2, 1.6) : R(.7, 1);
      const r = { x, y, ang, len, w, start, dur, k: DPR };
      const img = pick(IMG.roots), gen = IMG.roots.indexOf(img) >= 3;
      r.img = img; r.gen = gen; r.fl = rnd() < .5;

          if ((stage === 0) !== !!pass) continue;
          const s = p.size * (f < .12 ? .55 + .45 * f / .12 : 1 - .6 * (f - .12) / .88) * (stage === 3 ? 1.2 : 1), h = s * 2.19 * (1 + Math.min(.6, -p.vy / 250));
          c.globalAlpha = p.ef * (stage === 3 ? .7 * (1 - f) : 1 - f * .4) * (.82 + .18 * Math.sin(p.age * 31 + p.seed));
          c.drawImage(SPR.flame[stage], p.x - s / 2, p.y - h * .63, s, h);
        } else if (p.type === 6 && !pass) {             // dark glowing flake under the glow
          c.globalAlpha = .8 * (1 - f * f); c.fillStyle = '#3a2418'; c.fillRect(p.x - 1, p.y - 1, 2.2, 2.2);
        } else if (pass && (p.type === 1 || p.type === 6)) {
          const s = p.type === 6 ? p.size * 2.4 : p.size * 2.2;
          c.globalAlpha = p.ef * (Math.sin(p.age * (p.type === 6 ? 11 : 24) + p.seed) > -.4 ? 1 : .35) * (1 - f * f);

    }
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    if (!P.length && !G.plants.length) { G.cv.remove(); G.cv = null; return false; }
    return true;
  }
  const gActive = () => !!(G.cv && (G.parts.length || G.plants.length));

  function tick(ms){
    raf = -1;                                          // 'in a frame': ignitions from inside step() must not start a second loop

    const dt = Math.max(0, Math.min(.05, (ms - last) / 1000)); last = ms; clock += dt;
    // adaptive particle budget from the measured frame rate
    fpsN++; if (!fpsT) fpsT = ms;
    if (ms - fpsT > 1000) { const fps = fpsN * 1000 / (ms - fpsT); budget = fps < 45 ? Math.max(.35, budget * Math.max(.6, fps / 55)) : fps > 56 ? Math.min(1, budget * 1.1) : budget; fpsN = 0; fpsT = ms; }
    for (let i = burning.length - 1; i >= 0; i--) {
      const tr = burning[i];
      if (!tr.fire || !tr.el.isConnected) { burning.splice(i, 1); continue; }
      if (!step(tr, dt)) {
        burning.splice(i, 1);
        if (!tr.fire.act.canvas.isConnected) { /* finalised */ }
      }
    }

    if (burning.length || gActive()) raf = requestAnimationFrame(tick); else Weather.fire(false);

  document.addEventListener('visibilitychange', () => { if (!document.hidden && (burning.length || gActive())) run(); });

  return { click, igniteAll, ignite, igniteP, reset, hitTree, stats: () => ({ embers: G.parts.filter(p => p.type === 6).length, plantsBurning: G.plants.length, plantsBurnt: plants.filter(p => p.state === 2).length, burning: burning.length, budget, rain: +Weather.rainLevel().toFixed(2), parts: trees.reduce((n, t) => n + (t.fire ? t.fire.parts.length : 0), 0), byType: trees.reduce((a, t) => (t.fire && t.fire.parts.forEach(p => a[p.type]++), a), [0, 0, 0, 0, 0, 0]) }) };
})();

window.__tree = { get trees(){ return trees; }, get plants(){ return plants; }, get DPR(){ return DPR; }, Fire };   // handle for tests / console
function resume(){ if (!running && !document.hidden && FREEZE == null) { running = true; rafId = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', resume);

function restart(newSeed){
  if (newSeed) seed = (Math.random() * 1e9) | 0;
  cancelAnimationFrame(rafId); clearTimeout(hintTimer);
  hint.classList.remove('on');
  Fire.reset(); build(); Weather.attach(); t0 = performance.now(); running = true;
  rafId = requestAnimationFrame(frame);
}

Promise.all([Promise.all(STICKS.map(load)), Promise.all(LEAVES.map(load)), Promise.all(ROOTS.map(load)), Promise.all(CLODS.map(load)),
             Promise.all(DIRT.map(load)), load('assets/concrete.png'),
             Promise.all(BURNT(STICKS).map(load)), Promise.all(BURNT(LEAVES).map(load)), Promise.all(BURNT(ROOTS).map(load)),
             Promise.all(PLANTS.map(load)), Promise.all(BURNT(PLANTS).map(load))]).then(([st, lv, ro, cl, di, con, bst, blv, bro, pl, bpl]) => {
  IMG.grass = []; IMG.bush = [];
  PLANTS.forEach((path, i) => pl[i] && (path.includes('/grass_') ? IMG.grass : IMG.bush).push({ n: pl[i], b: bpl[i] || pl[i] }));
  IMG.burnt = new Map();
  st.forEach((im, i) => im && IMG.burnt.set(im, bst[i] || im)); ro.forEach((im, i) => im && IMG.burnt.set(im, bro[i] || im));
  IMG.burntLeaves = lv.map((im, i) => blv[i] || im);
  st = st.filter(Boolean);
  IMG.thick = st.filter(i => i.width / i.height > .17); IMG.thin = st.filter(i => i.width / i.height <= .17);
  if (!IMG.thick.length) IMG.thick = st; if (!IMG.thin.length) IMG.thin = st;
  IMG.roots = ro; IMG.clods = cl.filter(Boolean); IMG.dirt = di; IMG.concrete = con;
  leafTints = lv.map(bakeLeafTints);
  restart(false);
  stage.addEventListener('click', e => { if (!Fire.click(e.clientX, e.clientY)) restart(true); });
  addEventListener('keydown', e => { if (!e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'f') Fire.igniteAll(); });
  addEventListener('keydown', e => { if (!e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'z') restart(true); });
  let rt, lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      // ignore tiny height changes (mobile URL bar), rebuild on real size changes
      if (innerWidth === lastW && Math.abs(innerHeight - lastH) < lastH * .15) return;
      lastW = innerWidth; lastH = innerHeight; restart(false);
    }, 250);
  });
});
})();
